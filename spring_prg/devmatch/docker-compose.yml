services:
  postgres:
    image: postgres:16-alpine
    container_name: devmatch-postgres
    environment:
      POSTGRES_DB: devmatch
      POSTGRES_USER: devmatch_user
      POSTGRES_PASSWORD: devmatch_password
    ports:
      - "5432:5432"
    volumes:
      - devmatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmatch_user -d devmatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: devmatch-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devmatch
      SPRING_DATASOURCE_USERNAME: devmatch_user
      SPRING_DATASOURCE_PASSWORD: devmatch_password
    ports:
      - "8080:8080"

volumes:
  devmatch_postgres_data: